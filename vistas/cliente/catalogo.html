<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo | Biblioteca Villa</title>
    <link rel="stylesheet" href="../../css/estilos.css">
    <script src="../../js/utils/auth-guard.js" data-required-roles="CLIENTE,CLIENTE_REGULAR,CLIENTE_PREMIUM" data-login-url="../auth/login.html" data-forbidden-url="../../errors/403.html"></script>
  </head>
  <body>
    <header class="encabezado" data-app-header></header>
    <main class="catalogo">
      <section aria-labelledby="catalogo-titulo">
        <h1 id="catalogo-titulo">Catálogo de libros</h1>
        <p>Explora los títulos disponibles en la biblioteca.</p>

        <form class="catalogo-busqueda" data-catalog-filter role="search">
          <label class="campo" for="catalogo-busqueda">
            Buscar por título, autor o ISBN
            <input
              id="catalogo-busqueda"
              name="q"
              type="search"
              autocomplete="off"
              placeholder="Escribe para buscar..."
            >
          </label>
          <button class="boton boton--secundario" type="submit">Buscar</button>
        </form>

        <p class="aviso-api">
          La vista está preparada para consultar <code>GET /api/v1/libros</code>.
          El endpoint del backend aún debe implementarse y probarse.
        </p>
        <p class="catalogo-estado" data-catalog-status role="status" aria-live="polite"></p>
        <p class="mensaje" data-global-message role="alert" hidden></p>
        <div class="catalogo-libros" data-catalog-results aria-busy="false"></div>
      </section>
    </main>
    <script type="module" src="../../js/main.js"></script>
    <script type="module" src="../../js/modules/catalogo.js"></script>
  </body>
</html>

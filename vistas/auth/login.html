<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Biblioteca Villa</title>
    <link rel="stylesheet" href="../../css/estilos.css">
  </head>
  <body>
    <main class="auth-layout">
      <section class="tarjeta auth-card" aria-labelledby="login-title">
        <p class="eyebrow">Biblioteca Villa</p>
        <h1 id="login-title">Bienvenido de nuevo</h1>
        <p class="texto-secundario">Inicia sesión para continuar.</p>
        <p class="mensaje" data-form-message role="alert" hidden></p>
        <form class="formulario" data-login-form>
          <label class="campo" for="login-email">
            Correo electrónico
            <input id="login-email" name="email" type="email" autocomplete="username" required>
          </label>
          <label class="campo" for="login-password">
            Contraseña
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="boton" type="submit">Iniciar sesión</button>
        </form>
        <p class="auth-alternativa">¿Aún no tienes cuenta? <a href="./registro.html">Regístrate</a></p>
      </section>
    </main>
    <script type="module" src="../../js/main.js"></script>
    <script type="module" src="../../js/modules/login.js"></script>
  </body>
</html>

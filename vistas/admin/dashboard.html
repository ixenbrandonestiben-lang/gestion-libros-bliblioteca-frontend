<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel de administración | Biblioteca Villa</title>
    <link rel="stylesheet" href="../../css/estilos.css">
    <script src="../../js/utils/auth-guard.js" data-required-roles="ADMIN,ADMINISTRADOR,BIBLIOTECARIO" data-login-url="../auth/login.html" data-forbidden-url="../../errors/403.html"></script>
  </head>
  <body>
    <header class="encabezado" data-app-header></header>
    <main>
      <section aria-labelledby="dashboard-title">
        <p class="eyebrow">Administración</p>
        <h1 id="dashboard-title">Resumen de la biblioteca</h1>
        <p class="texto-secundario">Indicadores calculados a partir de los datos disponibles en la API.</p>
        <p class="mensaje" data-global-message role="alert" hidden></p>
        <p class="catalogo-estado" data-dashboard-status role="status" aria-live="polite">Consultando la API...</p>
        <div class="metricas-grid" data-dashboard-metrics aria-busy="true"></div>
      </section>
      <section class="seccion-dashboard" aria-labelledby="ventas-title">
        <h2 id="ventas-title">Ventas recientes</h2>
        <p class="catalogo-estado" data-sales-chart-status role="status">Cargando ventas...</p>
        <div class="grafico-barras" data-sales-chart aria-label="Gráfico de ventas recientes"></div>
      </section>
    </main>
    <script type="module" src="../../js/main.js"></script>
    <script type="module" src="../../js/modules/dashboard.js"></script>
  </body>
</html>
